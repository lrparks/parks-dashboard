<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeting Calendar - Little Rock Parks & Recreation Commission</title>
    <link href="styles.css" rel="stylesheet">
    <style>
        .meeting-day { font-weight: bold; cursor: pointer; transition: transform 0.2s; }
        .meeting-day:hover { transform: scale(1.15); z-index: 10; }
        .today { box-shadow: inset 0 0 0 2px #3b82f6; }
        .note-badge { position: absolute; top: -2px; right: -2px; width: 6px; height: 6px; background: #ef4444; border-radius: 50%; }
        .filter-pill { transition: all 0.2s; cursor: pointer; }
        .filter-pill.inactive { opacity: 0.4; }
    </style>
</head>
<body class="min-h-screen bg-gray-100">
    <!-- Navigation Header -->
    <div id="site-header"></div>

    <div class="max-w-6xl mx-auto p-4 sm:p-6">
        <!-- Page Header -->
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Meeting Calendar</h1>
            <p class="text-gray-600 text-sm mt-1">Commission meetings, special events, and important dates</p>
        </div>

        <!-- Year Navigation -->
        <div class="flex justify-center items-center gap-4 mb-4">
            <button onclick="changeYear(-1)" class="px-4 py-2 bg-white rounded-lg shadow hover:bg-gray-50 text-sm">← Previous</button>
            <h2 id="yearDisplay" class="text-2xl font-bold text-gray-800">2026</h2>
            <button onclick="changeYear(1)" class="px-4 py-2 bg-white rounded-lg shadow hover:bg-gray-50 text-sm">Next →</button>
        </div>

        <!-- Filter Pills -->
        <div id="filterPills" class="flex justify-center flex-wrap gap-2 mb-6"></div>

        <!-- Calendar Grid -->
        <div id="calendarGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>

        <!-- Upcoming Meetings List -->
        <div class="mt-8 bg-white rounded-lg shadow-md p-6">
            <h3 class="text-lg font-bold text-gray-800 mb-4">📅 Upcoming Meetings</h3>
            <div id="upcomingList" class="space-y-2"></div>
        </div>

        <!-- Meeting Detail Modal -->
        <div id="modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
            <div class="bg-white rounded-lg shadow-xl p-6 max-w-sm w-full max-h-[90vh] overflow-y-auto">
                <div class="flex justify-between items-start mb-4">
                    <h3 id="modalTitle" class="text-lg font-bold text-gray-800"></h3>
                    <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-xl">✕</button>
                </div>
                <div id="modalContent" class="space-y-2 text-gray-600"></div>
                <div class="mt-4 pt-4 border-t flex gap-2">
                    <a id="modalCalLink" href="#" class="flex-1 text-center px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700 text-sm">
                        Add to Calendar
                    </a>
                    <button onclick="closeModal()" class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300 text-sm">Close</button>
                </div>
            </div>
        </div>
    </div>

        <!-- PDF Viewer Modal -->
        <div id="docModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
            <div class="bg-white rounded-lg shadow-xl w-full max-w-4xl h-[90vh] flex flex-col">
                <div class="flex justify-between items-center p-4 border-b">
                    <h3 id="docModalTitle" class="font-bold text-gray-800"></h3>
                    <button onclick="closeDocModal()" class="text-gray-400 hover:text-gray-600 text-xl">✕</button>
                </div>
                <div class="flex-1 p-2">
                    <iframe id="docFrame" class="w-full h-full rounded border" src=""></iframe>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div id="site-footer"></div>

    <!-- Component Loader -->
    <script src="js/components.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadSiteComponents({ basePath: 'components' });
        });
    </script>

    <script>
        let meetingsData = null;
        let locations = {};
        let meetingTypes = {};
        let activeFilters = new Set();
        let currentYear = new Date().getFullYear();

        const monthNames = ["January", "February", "March", "April", "May", "June", 
                           "July", "August", "September", "October", "November", "December"];
        const dayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

        // Load meetings from JSON
        async function loadMeetings() {
            try {
                const response = await fetch('meetings.json');
                const data = await response.json();
                
                locations = data.locations || {};
                meetingTypes = data.meetingTypes || {};
                meetingsData = data.meetings || [];
                
                // Also include special_events if present
                if (data.special_events) {
                    meetingsData = meetingsData.concat(data.special_events);
                }
                
                // Initialize all filters as active
                Object.keys(meetingTypes).forEach(type => activeFilters.add(type));
                
                renderFilterPills();
                renderCalendar();
            } catch (error) {
                console.error('Error loading meetings.json:', error);
                document.getElementById('calendarGrid').innerHTML = 
                    '<p class="text-red-500 col-span-4 text-center py-8">Error loading calendar data.</p>';
            }
        }

        function renderFilterPills() {
            const container = document.getElementById('filterPills');
            let html = '';
            
            Object.entries(meetingTypes).forEach(([type, config]) => {
                const isActive = activeFilters.has(type);
                html += `
                    <button onclick="toggleFilter('${type}')" 
                            class="filter-pill ${isActive ? '' : 'inactive'} flex items-center gap-2 px-3 py-1.5 rounded-full text-sm font-medium text-white shadow-sm"
                            style="background-color: ${config.color}">
                        <span>${config.icon}</span>
                        <span>${config.name}</span>
                    </button>
                `;
            });
            
            container.innerHTML = html;
        }

        function toggleFilter(type) {
            if (activeFilters.has(type)) {
                activeFilters.delete(type);
            } else {
                activeFilters.add(type);
            }
            renderFilterPills();
            renderCalendar();
        }

        function getMeetingsForDate(year, month, day) {
            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            return meetingsData.filter(m => m.date === dateStr && activeFilters.has(m.type));
        }

        function generateMonth(year, month) {
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const today = new Date();
            
            let html = `
                <div class="bg-white rounded-lg shadow p-3">
                    <h3 class="text-center font-bold text-gray-700 mb-2 text-sm">${monthNames[month]}</h3>
                    <div class="grid grid-cols-7 gap-0.5 text-xs text-center text-gray-400 mb-1">
                        ${dayNames.map(d => `<div>${d[0]}</div>`).join('')}
                    </div>
                    <div class="grid grid-cols-7 gap-0.5">
            `;
            
            // Empty cells before first day
            for (let i = 0; i < firstDay; i++) {
                html += `<div class="h-7"></div>`;
            }
            
            // Days of month
            for (let day = 1; day <= daysInMonth; day++) {
                const meetings = getMeetingsForDate(year, month, day);
                const isToday = today.getFullYear() === year && today.getMonth() === month && today.getDate() === day;
                
                let classes = "h-7 w-7 flex items-center justify-center text-xs rounded relative mx-auto";
                let style = "";
                let onclick = "";
                
                if (meetings.length > 0) {
                    const meeting = meetings[0];
                    const typeConfig = meetingTypes[meeting.type] || meetingTypes['commission'];
                    classes += " meeting-day text-white";
                    style = `background-color: ${typeConfig.color}`;
                    onclick = `onclick="showMeeting('${meeting.date}')"`;
                } else if (isToday) {
                    classes += " today bg-blue-50 font-bold text-blue-700";
                } else {
                    classes += " text-gray-600 hover:bg-gray-100";
                }
                
                const hasNote = meetings.length > 0 && meetings[0].note;
                const noteIndicator = hasNote ? '<span class="note-badge"></span>' : '';
                
                html += `<div class="${classes}" style="${style}" ${onclick}>${day}${noteIndicator}</div>`;
            }
            
            html += `</div></div>`;
            return html;
        }

        function renderCalendar() {
            document.getElementById('yearDisplay').textContent = currentYear;
            
            let html = '';
            for (let month = 0; month < 12; month++) {
                html += generateMonth(currentYear, month);
            }
            document.getElementById('calendarGrid').innerHTML = html;
            
            renderUpcomingMeetings();
        }

        function renderUpcomingMeetings() {
            const today = new Date();
            const todayStr = today.toISOString().split('T')[0];
            
            // Get future meetings that match active filters
            const upcoming = meetingsData
                .filter(m => m.date && m.date >= todayStr && activeFilters.has(m.type))
                .sort((a, b) => a.date.localeCompare(b.date))
                .slice(0, 5);
            
            let html = '';
            if (upcoming.length === 0) {
                html = '<p class="text-gray-500 text-sm">No upcoming meetings for selected types.</p>';
            } else {
                upcoming.forEach(m => {
                    const dateObj = new Date(m.date + 'T12:00:00');
                    const dayName = dayNames[dateObj.getDay()];
                    const monthName = monthNames[dateObj.getMonth()];
                    const day = dateObj.getDate();
                    const year = dateObj.getFullYear();
                    const typeConfig = meetingTypes[m.type] || {};
                    const loc = locations[m.location] || {};
                    
                    html += `
                        <div class="flex items-center gap-4 p-3 bg-gray-50 rounded-lg hover:bg-gray-100 cursor-pointer" onclick="showMeeting('${m.date}')">
                            <div class="text-center text-white rounded p-2 min-w-14" style="background-color: ${typeConfig.color}">
                                <div class="text-xs">${monthName.slice(0,3)}</div>
                                <div class="text-xl font-bold">${day}</div>
                            </div>
                            <div class="flex-1">
                                <div class="font-medium text-gray-800">${dayName}, ${monthName} ${day}, ${year}</div>
                                <div class="text-sm text-gray-500">${m.time || '11:45'} AM • ${loc.room || 'TBD'}</div>
                                ${m.note ? `<div class="text-xs text-amber-600 mt-1">⚠️ ${m.note}</div>` : ''}
                            </div>
                        </div>
                    `;
                });
            }
            
            document.getElementById('upcomingList').innerHTML = html;
        }

        function showMeeting(dateStr) {
            const meetings = meetingsData.filter(m => m.date === dateStr);
            if (meetings.length === 0) return;
            
            const meeting = meetings[0];
            const dateObj = new Date(meeting.date + 'T12:00:00');
            const dayName = dayNames[dateObj.getDay()];
            const monthName = monthNames[dateObj.getMonth()];
            const day = dateObj.getDate();
            const year = dateObj.getFullYear();
            const typeConfig = meetingTypes[meeting.type] || {};
            const loc = locations[meeting.location] || {};
            
            document.getElementById('modalTitle').textContent = `${dayName}, ${monthName} ${day}, ${year}`;
            
            let content = `
                <div class="inline-block px-2 py-1 rounded text-white text-xs mb-2" style="background-color: ${typeConfig.color}">
                    ${typeConfig.icon} ${typeConfig.name}
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-gray-400">🕐</span>
                    <span>${meeting.time || '11:45'} AM</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-gray-400">📍</span>
                    <span>${loc.room || 'TBD'}${loc.building ? ', ' + loc.building : ''}</span>
                </div>
            `;
            
            if (meeting.note) {
                content += `
                    <div class="mt-2 p-2 bg-amber-50 border border-amber-200 rounded text-amber-800 text-sm">
                        ⚠️ ${meeting.note}
                    </div>
                `;
            }
            
            // Document links
            const docs = [];
            if (meeting.agenda) docs.push(['Agenda', meeting.agenda]);
            if (meeting.minutes) docs.push(['Minutes', meeting.minutes]);
            if (meeting.transcript) docs.push(['Transcript', meeting.transcript]);

            if (docs.length > 0) {
                content += `<div class="mt-3 pt-3 border-t"><div class="text-xs text-gray-500 mb-2">📎 Documents</div><div class="flex flex-wrap gap-2">`;
                docs.forEach(([label, path]) => {
                    content += `<button onclick="openDocViewer('${path}', '${label}')" class="px-2 py-1 bg-gray-100 hover:bg-gray-200 rounded text-xs text-gray-700">${label}</button>`;
                });
                content += `</div></div>`;
            }
            
            // Video link
            if (meeting.youtube) {
                content += `
                    <div class="mt-2">
                        <a href="https://www.youtube.com/watch?v=${meeting.youtube}" target="_blank" class="text-sm text-red-600 hover:text-red-700">
                            ▶️ Watch Recording
                        </a>
                    </div>
                `;
            }
            
            document.getElementById('modalContent').innerHTML = content;
            
            // Generate .ics calendar link
            const startDate = meeting.date.replace(/-/g, '') + 'T114500';
            const endDate = meeting.date.replace(/-/g, '') + 'T130000';
            const icsContent = `BEGIN:VCALENDAR
VERSION:2.0
BEGIN:VEVENT
DTSTART:${startDate}
DTEND:${endDate}
SUMMARY:${typeConfig.name || 'Parks Commission Meeting'}
LOCATION:${loc.room || ''}${loc.building ? ', ' + loc.building : ''}
DESCRIPTION:${meeting.note || 'Regular meeting'}
END:VEVENT
END:VCALENDAR`;
            
            const blob = new Blob([icsContent], { type: 'text/calendar' });
            const url = URL.createObjectURL(blob);
            document.getElementById('modalCalLink').href = url;
            document.getElementById('modalCalLink').download = `parks-meeting-${meeting.date}.ics`;
            
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        function openDocViewer(path, title) {
            document.getElementById('docModalTitle').textContent = title;
            document.getElementById('docFrame').src = path;
            document.getElementById('docModal').classList.remove('hidden');
        }

        function closeDocModal() {
            document.getElementById('docModal').classList.add('hidden');
            document.getElementById('docFrame').src = '';
        }

        function changeYear(delta) {
            const newYear = currentYear + delta;
            // Limit to 2022 and later (no data before Feb 2022)
            if (newYear < 2022) return;
            currentYear = newYear;
            renderCalendar();
        }

        // Close modals on escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
                closeDocModal();
            }
        });

        // Close modals on backdrop click
        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target.id === 'modal') closeModal();
        });
        document.getElementById('docModal').addEventListener('click', (e) => {
            if (e.target.id === 'docModal') closeDocModal();
        });

        // Initialize
        loadMeetings();
    </script>
</body>
</html>
