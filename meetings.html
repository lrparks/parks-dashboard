<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeting Archive - Little Rock Parks & Recreation</title>
    <link href="styles.css" rel="stylesheet">
    <!-- Fuse.js for fuzzy search -->
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
</head>
<body class="min-h-screen bg-gray-100">
    <!-- Navigation Header -->
    <div id="site-header"></div>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-6">
        <!-- Page Header -->
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Meeting Archive</h1>
            <p class="text-gray-600 text-sm mt-1">Commission meeting videos, agendas, minutes, and transcripts</p>
        </div>

        <!-- Search Box -->
        <div id="search-section" class="bg-white rounded-lg shadow-md p-4 mb-6">
            <div class="flex flex-col sm:flex-row gap-3">
                <div class="flex-1 relative">
                    <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                    <input type="text" id="searchInput" placeholder="Search meeting documents..."
                           class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 text-sm"
                           oninput="handleSearch(this.value)">
                </div>
                <button onclick="clearSearch()" id="clearBtn" class="hidden px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-lg text-sm transition">
                    Clear
                </button>
            </div>
            <!-- Document Type Filters -->
            <div class="mt-3 flex flex-wrap gap-3" id="docTypeFilters">
                <label class="inline-flex items-center gap-1.5 text-xs">
                    <input type="checkbox" checked class="rounded text-blue-600 focus:ring-blue-500" onchange="handleSearch(document.getElementById('searchInput').value)" data-type="agenda">
                    <span>Agendas</span>
                </label>
                <label class="inline-flex items-center gap-1.5 text-xs">
                    <input type="checkbox" checked class="rounded text-green-600 focus:ring-green-500" onchange="handleSearch(document.getElementById('searchInput').value)" data-type="minutes">
                    <span>Minutes</span>
                </label>
                <label class="inline-flex items-center gap-1.5 text-xs">
                    <input type="checkbox" checked class="rounded text-purple-600 focus:ring-purple-500" onchange="handleSearch(document.getElementById('searchInput').value)" data-type="transcript">
                    <span>Transcripts</span>
                </label>
            </div>
            <!-- Search Stats -->
            <div id="searchStats" class="mt-2 text-xs text-gray-500 hidden"></div>
        </div>

        <!-- Search Results Container -->
        <div id="search-results" class="hidden mb-6"></div>

        <!-- View Toggle -->
        <div class="mb-6" id="viewToggle">
            <div class="flex flex-wrap gap-1 rounded-lg border border-gray-200 bg-white p-1">
                <button onclick="setView('meeting')" id="btn-meeting"
                    class="px-3 sm:px-4 py-2 text-xs sm:text-sm font-medium rounded-md transition bg-green-600 text-white">
                    Meeting Details
                </button>
                <button onclick="setView('agenda')" id="btn-agenda"
                    class="px-3 sm:px-4 py-2 text-xs sm:text-sm font-medium rounded-md transition text-gray-600 hover:bg-gray-100">
                    Agenda
                </button>
                <button onclick="setView('minutes')" id="btn-minutes"
                    class="px-3 sm:px-4 py-2 text-xs sm:text-sm font-medium rounded-md transition text-gray-600 hover:bg-gray-100">
                    Minutes
                </button>
                <button onclick="setView('transcripts')" id="btn-transcripts"
                    class="px-3 sm:px-4 py-2 text-xs sm:text-sm font-medium rounded-md transition text-gray-600 hover:bg-gray-100">
                    Transcripts
                </button>
            </div>
        </div>

        <!-- Loading State -->
        <div id="loading" class="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-4 flex items-center gap-3">
            <div class="animate-spin rounded-full h-5 w-5 border-b-2 border-blue-600"></div>
            <span class="text-blue-700">Loading meetings...</span>
        </div>

        <!-- Error State -->
        <div id="error" class="bg-red-50 border border-red-200 rounded-lg p-4 mb-4 hidden">
            <span class="text-red-700">Error loading meetings. Please try again later.</span>
        </div>

        <!-- Meetings Container -->
        <div id="meetings-container" class="hidden space-y-6"></div>

        <!-- Document Viewer Modal -->
        <div id="doc-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-lg w-full max-w-4xl h-[80vh] flex flex-col">
                <div class="flex items-center justify-between p-4 border-b">
                    <h3 id="doc-title" class="font-semibold text-gray-800">Document</h3>
                    <div class="flex gap-2">
                        <a id="doc-new-tab" href="#" target="_blank" class="px-3 py-1.5 bg-gray-100 hover:bg-gray-200 rounded text-sm transition">
                            Open in New Tab
                        </a>
                        <button onclick="closeDocViewer()" class="px-3 py-1.5 bg-gray-100 hover:bg-gray-200 rounded text-sm transition">
                            Close
                        </button>
                    </div>
                </div>
                <iframe id="doc-iframe" class="flex-1 w-full" src=""></iframe>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div id="site-footer"></div>

    <!-- Component Loader -->
    <script src="js/components.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadSiteComponents({ basePath: 'components' });
        });
    </script>

    <script>
        // State
        let currentView = 'meeting';
        let meetingsData = [];
        let searchIndex = [];
        let fuse = null;
        let isSearching = false;

        // Year-based search indexes
        const SEARCH_INDEX_FILES = [
            'search-index-2022-2023.json',
            'search-index-2024.json',
            'search-index-2025.json',
            'search-index-2026.json'
        ];

        // Document type labels
        const DOC_TYPE_LABELS = {
            agenda: 'Agenda',
            minutes: 'Minutes',
            transcript: 'Transcript'
        };

        // Document type colors
        const DOC_TYPE_COLORS = {
            agenda: { bg: 'bg-blue-100', text: 'text-blue-600', hover: 'hover:bg-blue-50' },
            minutes: { bg: 'bg-green-100', text: 'text-green-600', hover: 'hover:bg-green-50' },
            transcript: { bg: 'bg-purple-100', text: 'text-purple-600', hover: 'hover:bg-purple-50' }
        };

        // Convert YYYYMM to display format
        function formatPeriod(period) {
            const year = period.substring(0, 4);
            const month = parseInt(period.substring(4, 6));
            const months = ['January', 'February', 'March', 'April', 'May', 'June',
                           'July', 'August', 'September', 'October', 'November', 'December'];
            return `${months[month - 1]} ${year}`;
        }

        // Set active view
        function setView(view) {
            currentView = view;

            // Update button styles
            const buttons = ['meeting', 'agenda', 'minutes', 'transcripts'];
            buttons.forEach(btn => {
                const el = document.getElementById(`btn-${btn}`);
                if (btn === view) {
                    el.className = 'px-3 sm:px-4 py-2 text-xs sm:text-sm font-medium rounded-md transition bg-green-600 text-white';
                } else {
                    el.className = 'px-3 sm:px-4 py-2 text-xs sm:text-sm font-medium rounded-md transition text-gray-600 hover:bg-gray-100';
                }
            });

            // Re-render with current data
            renderMeetings(meetingsData);
        }

        // Load meetings data
        async function loadMeetings() {
            try {
                const response = await fetch('meetings.json');
                if (!response.ok) throw new Error('Failed to load');
                const data = await response.json();
                const today = new Date().toISOString().split('T')[0];
                meetingsData = (data.meetings || []).filter(m => !m.date || m.date <= today);

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('meetings-container').classList.remove('hidden');

                renderMeetings(meetingsData);

                // Load search indexes
                loadSearchIndex();
            } catch (err) {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('error').classList.remove('hidden');
                console.error('Error loading meetings:', err);
            }
        }

        // Load full-text search indexes (filtered for meeting docs only)
        async function loadSearchIndex() {
            const allIndexed = [];
            let loadedCount = 0;

            const loadPromises = SEARCH_INDEX_FILES.map(async (file) => {
                try {
                    const response = await fetch(file);
                    if (response.ok) {
                        const data = await response.json();
                        loadedCount++;
                        return data;
                    }
                } catch (err) {
                    // Index file not available
                }
                return [];
            });

            const results = await Promise.all(loadPromises);
            results.forEach(data => allIndexed.push(...data));

            // Filter to only agenda, minutes, transcript types
            searchIndex = allIndexed.filter(doc =>
                doc.type === 'agenda' || doc.type === 'minutes' || doc.type === 'transcript'
            );

            if (searchIndex.length > 0) {
                // Build search data with formatted period
                const searchData = searchIndex.map(doc => ({
                    ...doc,
                    periodFormatted: formatPeriod(doc.period),
                    year: doc.period.substring(0, 4),
                    monthName: formatPeriod(doc.period).split(' ')[0],
                    typeLabel: DOC_TYPE_LABELS[doc.type] || doc.type
                }));

                fuse = new Fuse(searchData, {
                    keys: [
                        { name: 'typeLabel', weight: 1.5 },
                        { name: 'periodFormatted', weight: 1.5 },
                        { name: 'content', weight: 1 },
                        { name: 'title', weight: 1.2 },
                        { name: 'year', weight: 0.8 },
                        { name: 'monthName', weight: 0.8 }
                    ],
                    threshold: 0.4,
                    includeScore: true,
                    includeMatches: true,
                    ignoreLocation: true
                });
                console.log(`Meeting search loaded: ${searchIndex.length} docs from ${loadedCount} index files`);
            } else {
                console.log('No meeting search indexes available');
            }
        }

        // Get active document type filters
        function getActiveTypeFilters() {
            const checkboxes = document.querySelectorAll('#docTypeFilters input[type="checkbox"]');
            const active = [];
            checkboxes.forEach(cb => {
                if (cb.checked) active.push(cb.dataset.type);
            });
            return active;
        }

        // Handle search
        function handleSearch(query) {
            const clearBtn = document.getElementById('clearBtn');
            const searchResults = document.getElementById('search-results');
            const meetingsContainer = document.getElementById('meetings-container');
            const viewToggle = document.getElementById('viewToggle');
            const searchStats = document.getElementById('searchStats');
            const activeFilters = getActiveTypeFilters();

            if (!query.trim() || !fuse) {
                clearBtn.classList.add('hidden');
                searchResults.classList.add('hidden');
                meetingsContainer.classList.remove('hidden');
                viewToggle.classList.remove('hidden');
                searchStats.classList.add('hidden');
                isSearching = false;
                return;
            }

            isSearching = true;
            clearBtn.classList.remove('hidden');
            searchResults.classList.remove('hidden');
            meetingsContainer.classList.add('hidden');
            viewToggle.classList.add('hidden');
            searchStats.classList.remove('hidden');

            // Perform search
            let results = fuse.search(query);

            // Filter by document type
            results = results.filter(r => activeFilters.includes(r.item.type));

            // Update stats
            searchStats.textContent = `Found ${results.length} result${results.length !== 1 ? 's' : ''} for "${query}"`;

            // Render results
            renderSearchResults(results, query);
        }

        // Clear search
        function clearSearch() {
            document.getElementById('searchInput').value = '';
            handleSearch('');
        }

        // Render search results
        function renderSearchResults(results, query) {
            const container = document.getElementById('search-results');

            if (results.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-lg shadow-md p-8 text-center">
                        <svg class="w-12 h-12 mx-auto text-gray-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        <p class="text-gray-500">No documents found for "${query}"</p>
                        <p class="text-gray-400 text-sm mt-1">Try different keywords or check your filters</p>
                    </div>
                `;
                return;
            }

            let html = '<div class="bg-white rounded-lg shadow-md overflow-hidden"><div class="divide-y divide-gray-100">';
            results.forEach(result => {
                const doc = result.item;
                const score = Math.round((1 - result.score) * 100);
                const colors = DOC_TYPE_COLORS[doc.type] || { bg: 'bg-gray-100', text: 'text-gray-600', hover: 'hover:bg-gray-50' };

                html += `
                    <button onclick="openDocViewer('${doc.file}', '${DOC_TYPE_LABELS[doc.type]} - ${doc.periodFormatted}')"
                            class="w-full flex items-center justify-between px-4 py-3 ${colors.hover} transition text-left">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 ${colors.bg} rounded-lg flex items-center justify-center flex-shrink-0">
                                ${doc.type === 'agenda' ? `
                                    <svg class="w-5 h-5 ${colors.text}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                                    </svg>
                                ` : doc.type === 'minutes' ? `
                                    <svg class="w-5 h-5 ${colors.text}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                                    </svg>
                                ` : `
                                    <svg class="w-5 h-5 ${colors.text}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7" />
                                    </svg>
                                `}
                            </div>
                            <div class="min-w-0">
                                <div class="font-medium text-gray-800">${DOC_TYPE_LABELS[doc.type]}</div>
                                <div class="text-sm text-gray-500">${doc.periodFormatted}</div>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-xs text-gray-400 bg-gray-100 px-2 py-1 rounded">${score}%</span>
                            <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                            </svg>
                        </div>
                    </button>
                `;
            });
            html += '</div></div>';

            container.innerHTML = html;
        }

        // Render meetings based on current view
        function renderMeetings(meetings) {
            const container = document.getElementById('meetings-container');

            // Sort by period descending (newest first)
            const sorted = [...meetings].sort((a, b) => b.period.localeCompare(a.period));

            if (sorted.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-lg p-6 text-center text-gray-500">
                        No meetings available yet.
                    </div>
                `;
                return;
            }

            if (currentView === 'meeting') {
                container.innerHTML = sorted.map(meeting => meetingCard(meeting)).join('');
            } else if (currentView === 'agenda') {
                container.innerHTML = agendaView(sorted);
            } else if (currentView === 'minutes') {
                container.innerHTML = minutesView(sorted);
            } else if (currentView === 'transcripts') {
                container.innerHTML = transcriptsView(sorted);
            }
        }

        // Full meeting card component
        function meetingCard(meeting) {
            const hasVideo = meeting.youtube && meeting.youtube !== 'VIDEO_ID';
            const hasAgenda = meeting.agenda;
            const hasMinutes = meeting.minutes;
            const hasTranscript = meeting.transcript;

            return `
                <div class="bg-white rounded-lg shadow overflow-hidden">
                    <!-- Header -->
                    <div class="bg-green-50 border-b px-4 py-3">
                        <div class="flex flex-wrap items-center justify-between gap-2">
                            <div>
                                <span class="text-xs text-green-600 font-medium">${formatPeriod(meeting.period)}</span>
                                <h2 class="text-lg font-semibold text-gray-800">${meeting.title}</h2>
                            </div>
                        </div>
                    </div>

                    <div class="p-4">
                        <!-- 2-column grid: Video left, Documents right -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <!-- Video Column -->
                            <div>
                                ${hasVideo ? `
                                    <div class="relative w-full video-container" style="padding-bottom: 56.25%;" data-video-id="${meeting.youtube}">
                                        <!-- YouTube Thumbnail (Click to Load) -->
                                        <div class="absolute inset-0 cursor-pointer video-thumbnail group" onclick="loadVideo(this)">
                                            <img
                                                src="https://img.youtube.com/vi/${meeting.youtube}/maxresdefault.jpg"
                                                alt="${meeting.title}"
                                                class="w-full h-full object-cover rounded-lg"
                                                onerror="this.src='https://img.youtube.com/vi/${meeting.youtube}/hqdefault.jpg'"
                                            />
                                            <!-- Play Button Overlay -->
                                            <div class="absolute inset-0 flex items-center justify-center bg-black bg-opacity-30 group-hover:bg-opacity-40 transition rounded-lg">
                                                <div class="bg-red-600 rounded-full p-3 group-hover:scale-110 transition transform">
                                                    <svg class="w-8 h-8 text-white" fill="currentColor" viewBox="0 0 24 24">
                                                        <path d="M8 5v14l11-7z"/>
                                                    </svg>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                ` : `
                                    <div class="bg-gray-100 rounded-lg p-6 text-center text-gray-500 h-full flex flex-col items-center justify-center">
                                        <svg class="w-10 h-10 mb-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
                                        </svg>
                                        <p class="text-sm">Video not yet available</p>
                                    </div>
                                `}
                            </div>

                            <!-- Documents Column -->
                            <div class="flex flex-col gap-2">
                                ${hasAgenda ? `
                                    <button onclick="openDocViewer('${meeting.agenda}', 'Agenda - ${meeting.title}')"
                                       class="w-full flex items-center gap-3 px-4 py-3 bg-blue-50 text-blue-700 rounded-lg hover:bg-blue-100 transition text-sm text-left">
                                        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                                        </svg>
                                        <span class="font-medium">Agenda</span>
                                    </button>
                                ` : ''}
                                ${hasMinutes ? `
                                    <button onclick="openDocViewer('${meeting.minutes}', 'Minutes - ${meeting.title}')"
                                       class="w-full flex items-center gap-3 px-4 py-3 bg-green-50 text-green-700 rounded-lg hover:bg-green-100 transition text-sm text-left">
                                        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                                        </svg>
                                        <span class="font-medium">Minutes</span>
                                    </button>
                                ` : ''}
                                ${hasTranscript ? `
                                    <button onclick="openDocViewer('${meeting.transcript}', 'Transcript - ${meeting.title}')"
                                       class="w-full flex items-center gap-3 px-4 py-3 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition text-sm text-left">
                                        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7" />
                                        </svg>
                                        <span class="font-medium">Transcript</span>
                                    </button>
                                ` : ''}
                                ${!hasAgenda && !hasMinutes && !hasTranscript ? `
                                    <div class="text-gray-400 text-sm p-4 bg-gray-50 rounded-lg text-center">
                                        Documents not yet available
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Agenda-only view
        function agendaView(meetings) {
            const withAgenda = meetings.filter(m => m.agenda);

            if (withAgenda.length === 0) {
                return `
                    <div class="bg-white rounded-lg p-6 text-center text-gray-500">
                        No agendas available yet.
                    </div>
                `;
            }

            return `
                <div class="bg-white rounded-lg shadow overflow-hidden">
                    <div class="divide-y divide-gray-100">
                        ${withAgenda.map(meeting => `
                            <button onclick="openDocViewer('${meeting.agenda}', 'Agenda - ${meeting.title}')"
                               class="w-full flex items-center justify-between px-4 py-3 hover:bg-gray-50 transition text-left">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 bg-blue-100 rounded-lg flex items-center justify-center">
                                        <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                                        </svg>
                                    </div>
                                    <div>
                                        <div class="font-medium text-gray-800">${meeting.title}</div>
                                        <div class="text-sm text-gray-500">${formatPeriod(meeting.period)}</div>
                                    </div>
                                </div>
                                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                                </svg>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // Minutes-only view
        function minutesView(meetings) {
            const withMinutes = meetings.filter(m => m.minutes);

            if (withMinutes.length === 0) {
                return `
                    <div class="bg-white rounded-lg p-6 text-center text-gray-500">
                        No minutes available yet.
                    </div>
                `;
            }

            return `
                <div class="bg-white rounded-lg shadow overflow-hidden">
                    <div class="divide-y divide-gray-100">
                        ${withMinutes.map(meeting => `
                            <button onclick="openDocViewer('${meeting.minutes}', 'Minutes - ${meeting.title}')"
                               class="w-full flex items-center justify-between px-4 py-3 hover:bg-gray-50 transition text-left">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 bg-green-100 rounded-lg flex items-center justify-center">
                                        <svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                                        </svg>
                                    </div>
                                    <div>
                                        <div class="font-medium text-gray-800">${meeting.title}</div>
                                        <div class="text-sm text-gray-500">${formatPeriod(meeting.period)}</div>
                                    </div>
                                </div>
                                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                                </svg>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // Transcripts-only view
        function transcriptsView(meetings) {
            const withTranscripts = meetings.filter(m => m.transcript);

            if (withTranscripts.length === 0) {
                return `
                    <div class="bg-white rounded-lg p-6 text-center text-gray-500">
                        No transcripts available yet.
                    </div>
                `;
            }

            return `
                <div class="bg-white rounded-lg shadow overflow-hidden">
                    <div class="divide-y divide-gray-100">
                        ${withTranscripts.map(meeting => `
                            <button onclick="openDocViewer('${meeting.transcript}', 'Transcript - ${meeting.title}')"
                               class="w-full flex items-center justify-between px-4 py-3 hover:bg-gray-50 transition text-left">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 bg-purple-100 rounded-lg flex items-center justify-center">
                                        <svg class="w-5 h-5 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7" />
                                        </svg>
                                    </div>
                                    <div>
                                        <div class="font-medium text-gray-800">${meeting.title}</div>
                                        <div class="text-sm text-gray-500">${formatPeriod(meeting.period)}</div>
                                    </div>
                                </div>
                                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                                </svg>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // Load video on thumbnail click (lazy loading)
        function loadVideo(thumbnail) {
            const container = thumbnail.parentElement;
            const videoId = container.dataset.videoId;

            // Create iframe element
            const iframe = document.createElement('iframe');
            iframe.className = 'absolute inset-0 w-full h-full rounded-lg';
            iframe.src = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&rel=0`;
            iframe.title = 'YouTube video player';
            iframe.frameBorder = '0';
            iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
            iframe.allowFullscreen = true;

            // Replace thumbnail with iframe
            container.innerHTML = '';
            container.appendChild(iframe);
        }

        // Open document viewer modal
        function openDocViewer(file, title) {
            document.getElementById('doc-title').textContent = title;
            document.getElementById('doc-iframe').src = file;
            document.getElementById('doc-new-tab').href = file;
            document.getElementById('doc-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        // Close document viewer modal
        function closeDocViewer() {
            document.getElementById('doc-modal').classList.add('hidden');
            document.getElementById('doc-iframe').src = '';
            document.body.style.overflow = '';
        }

        // Close modal on escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeDocViewer();
        });

        // Close modal on backdrop click
        document.getElementById('doc-modal').addEventListener('click', (e) => {
            if (e.target.id === 'doc-modal') closeDocViewer();
        });

        // Initialize
        loadMeetings();
    </script>
</body>
</html>
